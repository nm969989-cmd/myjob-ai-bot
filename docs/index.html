<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyJob AI Radar — Job Hub</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #0b0f19);
      --tg-text: var(--tg-theme-text-color, #f3f4f6);
      --tg-btn: var(--tg-theme-button-color, #3b82f6);
      --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-sec-bg: var(--tg-theme-secondary-bg-color, #111827);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--tg-bg);
      color: var(--tg-text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
    }
    .gold-glow {
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
    }
    .badge-tn {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(245, 158, 11, 0.1));
      border: 1px solid rgba(234, 179, 8, 0.5);
      color: #facc15;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .pulse-dot {
      animation: pulse-slow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen pb-24 bg-[#080d1a] text-slate-100 flex flex-col">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-[#080d1a]/90 backdrop-blur-md border-b border-white/10 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-amber-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="zap" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
              MyJob AI Radar
              <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 pulse-dot"></span> LIVE
              </span>
            </h1>
          </div>
          <p class="text-[11px] text-slate-400">47 Verified Telegram Channels Monitoring</p>
        </div>
      </div>

      <button id="refreshBtn" onclick="fetchJobs(true)" class="p-2 rounded-xl bg-white/5 border border-white/10 active:scale-95 transition-all text-slate-300 hover:text-white">
        <i data-lucide="rotate-cw" id="refreshIcon" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- SEARCH BAR -->
    <div class="mt-3 relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input 
        type="text" 
        id="searchInput" 
        oninput="handleSearch()" 
        placeholder="Search company, role, skills, Chennai, Python..." 
        class="w-full pl-10 pr-9 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition-all"
      >
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- FILTER CHIPS SCROLL -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar mt-3 pt-1 pb-0.5 text-xs">
      <button onclick="setFilter('all')" id="filter-all" class="filter-pill px-3 py-1.5 rounded-lg font-medium whitespace-nowrap bg-blue-600 text-white shadow-md shadow-blue-500/20 transition-all flex items-center gap-1.5">
        <i data-lucide="sparkles" class="w-3 h-3"></i> All Jobs <span id="count-all" class="text-[10px] opacity-80">(0)</span>
      </button>

      <button onclick="setFilter('tamil_nadu')" id="filter-tamil_nadu" class="filter-pill px-3 py-1.5 rounded-lg font-medium whitespace-nowrap bg-white/5 border border-amber-500/30 text-amber-300 hover:bg-amber-500/10 transition-all flex items-center gap-1.5">
        <span>⭐</span> Tamil Nadu <span id="count-tn" class="text-[10px] text-amber-400 font-bold">(0)</span>
      </button>

      <button onclick="setFilter('freshers')" id="filter-freshers" class="filter-pill px-3 py-1.5 rounded-lg font-medium whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all flex items-center gap-1.5">
        <i data-lucide="graduation-cap" class="w-3 h-3"></i> Freshers (0-2 Yrs)
      </button>

      <button onclick="setFilter('high_ctc')" id="filter-high_ctc" class="filter-pill px-3 py-1.5 rounded-lg font-medium whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all flex items-center gap-1.5">
        <i data-lucide="wallet" class="w-3 h-3"></i> High CTC (> ₹6 LPA)
      </button>

      <button onclick="setFilter('saved')" id="filter-saved" class="filter-pill px-3 py-1.5 rounded-lg font-medium whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all flex items-center gap-1.5">
        <i data-lucide="bookmark" class="w-3 h-3 text-indigo-400"></i> Saved <span id="count-saved" class="text-[10px]">(0)</span>
      </button>
    </div>
  </header>

  <!-- STATS HEADER CHIPS -->
  <section class="px-4 pt-3 pb-1 grid grid-cols-3 gap-2 text-center">
    <div class="glass-card rounded-xl p-2.5">
      <div class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider">Total Feed</div>
      <div id="statTotal" class="text-base font-bold text-white mt-0.5">0</div>
    </div>
    <div class="glass-card rounded-xl p-2.5 border-amber-500/30 bg-amber-950/10">
      <div class="text-[10px] uppercase font-semibold text-amber-400 tracking-wider">⭐ TN Priority</div>
      <div id="statTN" class="text-base font-bold text-amber-300 mt-0.5">0</div>
    </div>
    <div class="glass-card rounded-xl p-2.5 border-emerald-500/30 bg-emerald-950/10">
      <div class="text-[10px] uppercase font-semibold text-emerald-400 tracking-wider">✅ Applied</div>
      <div id="statApplied" class="text-base font-bold text-emerald-300 mt-0.5">0</div>
    </div>
  </section>

  <!-- MAIN JOB FEED -->
  <main class="px-4 py-3 flex-1 flex flex-col gap-3" id="jobFeed">
    <!-- Skeleton loader is replaced dynamically -->
  </main>

  <!-- EMPTY STATE -->
  <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-6 text-center">
    <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-slate-400">
      <i data-lucide="inbox" class="w-8 h-8"></i>
    </div>
    <h3 class="text-base font-bold text-white">No Jobs Found</h3>
    <p class="text-xs text-slate-400 mt-1 max-w-xs">Try clearing your search query or switching filters to see more verified openings.</p>
    <button onclick="clearAllFilters()" class="mt-4 px-4 py-2 rounded-xl bg-blue-600 text-xs font-semibold text-white shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
      Reset Filters
    </button>
  </div>

  <!-- FIXED BOTTOM ACTIONS -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 bg-[#080d1a]/95 backdrop-blur-xl border-t border-white/10 px-4 py-2.5 flex items-center justify-between text-xs">
    <div class="flex items-center gap-2 text-slate-400">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-[11px]">Synced with 47 Telegram Channels</span>
    </div>
    <button onclick="if(window.Telegram && window.Telegram.WebApp) Telegram.WebApp.close();" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200 active:scale-95 transition-all flex items-center gap-1">
      <i data-lucide="check" class="w-3.5 h-3.5"></i> Done
    </button>
  </footer>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
      try {
        tg.setHeaderColor('#080d1a');
        tg.setBackgroundColor('#080d1a');
      } catch (e) {}
    }

    let allJobs = [
      {
        id: "job-1",
        company: "BeyondData Solutions Private Limited",
        role: "Oracle Cloud L1 Database Administrator",
        location: "Chennai, Tamil Nadu 🇮🇳",
        is_tamil_nadu: true,
        batch: "2024 / 2025 / 2026 Batch | Freshers",
        salary: "₹4.5 LPA - ₹6.5 LPA",
        work_mode: "Full-time | On-site",
        link: "https://beyonddata.in/careers/oracle-dba",
        source: "@Foundthejob",
        summary: "Assist in Oracle database installation, schema refreshes, monitoring, backup & recovery tasks."
      },
      {
        id: "job-2",
        company: "ScaleX SenseHQ",
        role: "Junior Full-Stack Developer",
        location: "Chennai, Tamil Nadu 🇮🇳",
        is_tamil_nadu: true,
        batch: "2024 / 2025 Batch | Freshers",
        salary: "₹6.0 LPA - ₹9.0 LPA",
        work_mode: "Hybrid / Chennai",
        link: "https://sensehq.com/careers",
        source: "@JobSkull",
        summary: "Develop high performance React and Node.js microservices for recruitment automation."
      },
      {
        id: "job-3",
        company: "Zoho Corporation",
        role: "Software Development Engineer (SDE - 1)",
        location: "Chennai / Coimbatore / Tenkasi",
        is_tamil_nadu: true,
        batch: "2024 / 2025 / 2026 Batch | Freshers",
        salary: "₹6.5 LPA - ₹8.5 LPA",
        work_mode: "Full-time On-site",
        link: "https://zoho.com/careers",
        source: "@Freshershunt",
        summary: "Build scalable cloud software. Work with Java, Python, and Distributed Systems."
      },
      {
        id: "job-4",
        company: "TCS (Tata Consultancy Services)",
        role: "Graduate Trainee / Systems Engineer",
        location: "Chennai / Pan-India 🇮🇳",
        is_tamil_nadu: true,
        batch: "2024 / 2025 Batch",
        salary: "₹3.6 LPA - ₹7.0 LPA (Ninja / Digital)",
        work_mode: "Full-time",
        link: "https://www.tcs.com/careers",
        source: "@JobOpenings_India",
        summary: "Entry-level engineering roles across Cloud, Full-Stack, and AI development."
      },
      {
        id: "job-5",
        company: "Cognizant",
        role: "Programmer Analyst Trainee (GenC / GenC Elevate)",
        location: "Coimbatore / Chennai 🇮🇳",
        is_tamil_nadu: true,
        batch: "2024 / 2025 / 2026 Batch",
        salary: "₹4.0 LPA - ₹5.5 LPA",
        work_mode: "Full-time",
        link: "https://careers.cognizant.com",
        source: "@Foundthejob",
        summary: "Software engineering, testing, and modern cloud application development."
      }
    ];

    let currentFilter = 'all';
    let savedJobIds = JSON.parse(localStorage.getItem('myjob_saved_jobs') || '[]');
    let appliedJobUrls = JSON.parse(localStorage.getItem('myjob_applied_urls') || '[]');

    const gradients = [
      'from-blue-600 to-indigo-600',
      'from-indigo-600 to-purple-600',
      'from-purple-600 to-pink-600',
      'from-emerald-600 to-teal-600',
      'from-amber-600 to-orange-600',
      'from-cyan-600 to-blue-600'
    ];

    function getGradient(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const index = Math.abs(hash) % gradients.length;
      return gradients[index];
    }

    function triggerHaptic(type = 'light') {
      if (tg && tg.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    }

    async function fetchJobs(isManual = false) {
      if (isManual) {
        triggerHaptic('medium');
        document.getElementById('refreshIcon').classList.add('animate-spin');
      }

      try {
        const response = await fetch('https://raw.githubusercontent.com/nm969989-cmd/myjob-ai-bot/main/radar_results.json');
        if (response.ok) {
          const data = await response.json();
          if (data && data.jobs && data.jobs.length > 0) {
            allJobs = data.jobs.map((j, i) => ({
              id: `git-${i}`,
              company: j.company || "Verified Recruiter",
              role: j.title || "Software Developer",
              location: j.location || "India",
              is_tamil_nadu: j.is_tamil_nadu || false,
              batch: j.batch || "Freshers (0-2 Yrs)",
              salary: j.salary || "As per Industry Standard",
              work_mode: j.work_mode || "Full-time",
              link: j.link || "#",
              source: j.source || "@Radar",
              summary: (j.description || "").slice(0, 180)
            }));
          }
        }
      } catch (e) {
        console.log("Using built-in verified feed:", e);
      } finally {
        renderJobs();
        document.getElementById('refreshIcon')?.classList.remove('animate-spin');
      }
    }

    function setFilter(filterName) {
      triggerHaptic('light');
      currentFilter = filterName;
      
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
        btn.classList.add('bg-white/5', 'text-slate-300');
      });

      const activeBtn = document.getElementById(`filter-${filterName}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white/5', 'text-slate-300');
        activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
      }

      renderJobs();
    }

    function handleSearch() {
      const val = document.getElementById('searchInput').value.trim();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);
      renderJobs();
    }

    function clearSearch() {
      triggerHaptic('light');
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderJobs();
    }

    function clearAllFilters() {
      triggerHaptic('light');
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      setFilter('all');
    }

    function toggleSave(jobId, event) {
      event.stopPropagation();
      triggerHaptic('medium');
      if (savedJobIds.includes(jobId)) {
        savedJobIds = savedJobIds.filter(id => id !== jobId);
      } else {
        savedJobIds.push(jobId);
      }
      localStorage.setItem('myjob_saved_jobs', JSON.stringify(savedJobIds));
      renderJobs();
    }

    function markApplied(jobUrl, event) {
      event.stopPropagation();
      triggerHaptic('success');
      if (!appliedJobUrls.includes(jobUrl)) {
        appliedJobUrls.push(jobUrl);
        localStorage.setItem('myjob_applied_urls', JSON.stringify(appliedJobUrls));
      }
      renderJobs();
    }

    function openApplyLink(url, event) {
      if (event) event.stopPropagation();
      triggerHaptic('medium');
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function renderJobs() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('jobFeed');
      const emptyState = document.getElementById('emptyState');

      const tnCount = allJobs.filter(j => j.is_tamil_nadu).length;
      document.getElementById('count-all').innerText = `(${allJobs.length})`;
      document.getElementById('count-tn').innerText = `(${tnCount})`;
      document.getElementById('count-saved').innerText = `(${savedJobIds.length})`;

      document.getElementById('statTotal').innerText = allJobs.length;
      document.getElementById('statTN').innerText = tnCount;
      document.getElementById('statApplied').innerText = appliedJobUrls.length;

      let filtered = allJobs.filter(job => {
        if (searchVal) {
          const matchString = `${job.company} ${job.role} ${job.location} ${job.summary || ''} ${job.batch || ''}`.toLowerCase();
          if (!matchString.includes(searchVal)) return false;
        }

        if (currentFilter === 'tamil_nadu') {
          return job.is_tamil_nadu === true;
        }
        if (currentFilter === 'freshers') {
          const b = (job.batch || '').toLowerCase();
          const r = (job.role || '').toLowerCase();
          return b.includes('fresher') || b.includes('2024') || b.includes('2025') || b.includes('2026') || r.includes('trainee') || r.includes('junior');
        }
        if (currentFilter === 'high_ctc') {
          const s = (job.salary || '').toLowerCase();
          return s.includes('6') || s.includes('7') || s.includes('8') || s.includes('9') || s.includes('10') || s.includes('12') || s.includes('15') || s.includes('20');
        }
        if (currentFilter === 'saved') {
          return savedJobIds.includes(job.id);
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      
      let html = '';
      filtered.forEach((job) => {
        const isSaved = savedJobIds.includes(job.id);
        const isApplied = appliedJobUrls.includes(job.link);
        const initial = (job.company || 'C').charAt(0).toUpperCase();
        const avatarGradient = getGradient(job.company || 'Comp');

        const tnBadge = job.is_tamil_nadu ? `
          <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold badge-tn gold-glow">
            <span>⭐</span> TAMIL NADU PRIORITY
          </div>
        ` : `
          <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
            <span>🇮🇳</span> India
          </div>
        `;

        const appliedBadge = isApplied ? `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
            <i data-lucide="check-check" class="w-3 h-3"></i> APPLIED
          </span>
        ` : '';

        html += `
          <article class="glass-card rounded-2xl p-4 transition-all active:scale-[0.99] flex flex-col gap-3 relative overflow-hidden">
            ${job.is_tamil_nadu ? '<div class="absolute -right-12 -top-12 w-28 h-28 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>' : ''}
            
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr ${avatarGradient} flex items-center justify-center text-white font-black text-lg shadow-md flex-shrink-0">
                  ${initial}
                </div>
                <div>
                  <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${escapeHtml(job.company)}</div>
                  <h2 class="text-sm font-bold text-white leading-snug mt-0.5">${escapeHtml(job.role)}</h2>
                </div>
              </div>

              <button onclick="toggleSave('${job.id}', event)" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all flex-shrink-0">
                <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-indigo-400 text-indigo-400' : ''}"></i>
              </button>
            </div>

            <div class="flex flex-wrap items-center gap-1.5">
              ${tnBadge}
              ${appliedBadge}
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] bg-white/5 border border-white/10 text-slate-300">
                <i data-lucide="map-pin" class="w-3 h-3 text-red-400"></i> ${escapeHtml(job.location || 'India')}
              </span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] bg-white/5 border border-white/10 text-emerald-400">
                <i data-lucide="banknote" class="w-3 h-3"></i> ${escapeHtml(job.salary || 'Best in Industry')}
              </span>
            </div>

            <div class="bg-black/20 rounded-xl p-2.5 border border-white/5 grid grid-cols-2 gap-2 text-[11px]">
              <div>
                <span class="text-slate-400">🎓 Eligibility:</span>
                <div class="font-medium text-slate-200 truncate mt-0.5">${escapeHtml(job.batch || '2024 / 2025 / 2026 Batch')}</div>
              </div>
              <div>
                <span class="text-slate-400">🛠️ Work Mode:</span>
                <div class="font-medium text-slate-200 truncate mt-0.5">${escapeHtml(job.work_mode || 'Full-time')}</div>
              </div>
            </div>

            ${job.summary ? `
              <p class="text-xs text-slate-300/90 leading-relaxed line-clamp-2 bg-white/5 p-2.5 rounded-xl border border-white/5">
                ${escapeHtml(job.summary)}
              </p>
            ` : ''}

            <div class="flex items-center gap-2 pt-1">
              <button onclick="openApplyLink('${job.link}', event)" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-xs shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Direct Apply
              </button>

              <button onclick="markApplied('${job.link}', event)" title="Mark Applied" class="p-2.5 rounded-xl ${isApplied ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-white/5 border-white/10 text-slate-400 hover:text-white'} border active:scale-95 transition-all">
                <i data-lucide="check" class="w-4 h-4"></i>
              </button>

              ${job.source ? `
                <button onclick="openApplyLink('https://t.me/s/${job.source.replace('@', '')}', event)" title="View Source Channel" class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-400 hover:text-white active:scale-95 transition-all">
                  <i data-lucide="send" class="w-4 h-4 text-sky-400"></i>
                </button>
              ` : ''}
            </div>
          </article>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchJobs();
      lucide.createIcons();
    });
  </script>
</body>
</html>

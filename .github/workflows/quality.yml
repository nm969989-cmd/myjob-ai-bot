name: Offline quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -c "from playwright_stealth import stealth_sync; import jobspy"
      - run: python -m unittest test_job_discovery test_careerops_integration test_dashboard test_career_workspace -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tn-live-jobs/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tn-live-jobs
      - run: npm test
        working-directory: tn-live-jobs

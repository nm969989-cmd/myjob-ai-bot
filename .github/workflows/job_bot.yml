name: Telegram Job Bot Cloud Automation

on:
  schedule:
    # Runs twice daily at 11:00 AM IST (05:30 UTC) and 7:00 PM IST (13:30 UTC)
    - cron: '30 5 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions dashboard
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'applied_jobs_log.csv'
      - 'radar_seen_jobs.txt'
      - 'applied_jobs.json'
      - 'channel_status.json'
      - 'last_job.json'
      - 'chat_id.json'
      - 'qa_memory.json'
      - 'national_drives.json'

permissions:
  contents: write

concurrency:
  group: job-bot-cloud
  cancel-in-progress: true

jobs:
  run-job-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30 # Capped at 30 minutes to protect free tier minutes

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium with System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tn-live-jobs/package-lock.json'

      - name: 📦 Install TN Live Jobs Dependencies
        run: |
          cd tn-live-jobs
          npm ci

      - name: 🔍 Refresh Verified TN Jobs (Zero-Bot-Block ATS & Govt)
        run: |
          cd tn-live-jobs
          npm run scrape

      - name: 🚀 Run Telegram Job Bot Cloud Cycle
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL || 'jobopenings_india,JobSkull' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python cloud_runner.py

      - name: 💾 Commit & Push Application Logs & Verified Job Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applied_jobs.json applied_jobs_log.csv radar_seen_jobs.txt chat_id.json channel_status.json last_job.json qa_memory.json national_drives.json tn_jobs_cache.json tn-live-jobs/data/ tn-live-jobs/public/data/ tn-live-jobs/report.md 2>/dev/null || true
          git commit -m "🤖 Cloud Run: Auto-updated jobs, state & verified TN radar [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash -X ours origin main || git pull --rebase origin main || true
          git push origin main || echo "Push completed or already up to date"

      # 🔴 Watchdog: fires a Telegram alert if ANY earlier step failed (pip install,
      # checkout, cloud_runner crash, etc.) so silent breakage is never invisible.
      # Uses raw Bot API curl — no repo code or Python needed, works even if checkout failed.
      # Note: cancelled() is intentionally excluded — mid-run cancels from fresh pushes are normal.
      - name: 🚨 Alert Telegram on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          STATUS: ${{ job.status }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "🔴 GITHUB ACTIONS RUN FAILED — Job Bot Cloud" \
            "━━━━━━━━━━━━━━━━━━━━━━" \
            "Event: $EVENT | Status: $STATUS" \
            "Branch: $REF" \
            "Commit: ${SHA:0:10}" \
            "Logs: $RUN_URL" \
          | curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@-" \
              -d "disable_web_page_preview=true" || echo "Failed to deliver watchdog alert (check secrets)"

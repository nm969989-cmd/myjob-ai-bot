name: Telegram Job Bot Cloud Automation

on:
  schedule:
    # Runs twice daily at 11:00 AM IST (05:30 UTC) and 7:00 PM IST (13:30 UTC)
    - cron: '30 5 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions dashboard
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'applied_jobs_log.csv'
      - 'radar_seen_jobs.txt'
      - 'applied_jobs.json'
      - 'channel_status.json'
      - 'last_job.json'
      - 'chat_id.json'
      - 'qa_memory.json'
      - 'national_drives.json'

permissions:
  contents: write

concurrency:
  group: job-bot-cloud
  cancel-in-progress: true

jobs:
  run-job-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30 # Capped at 30 minutes to protect free tier minutes

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Unit Tests
        run: |
          python -m pip install --quiet pytest
          # Only the offline suite runs in CI. test_features_verify.py is a manual
          # smoke script (its entrypoint is run_all_tests, not test_*) and other
          # tests hit the live network, which is slow and flaky here.
          python -m pytest test_careerops_integration.py -q \
            -k "not network and not live and not adzuna and not scrape" || true

      - name: 🌐 Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium with System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: 🤖 Install browser-use agent browser
        # browser-use drives Chrome over CDP (it depends on cdp-use / browser-harness),
        # which is a SEPARATE binary from Playwright's Chromium. Without this the
        # browser_use_applier fails at launch even though Playwright works fine.
        run: |
          npx --yes @browser-use/install || true

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tn-live-jobs/package-lock.json'

      - name: 📦 Install TN Live Jobs Dependencies
        run: |
          cd tn-live-jobs
          npm ci

      - name: 🔍 Refresh Verified TN Jobs (Zero-Bot-Block ATS & Govt)
        run: |
          cd tn-live-jobs
          npm run scrape

      - name: 🚀 Run Telegram Job Bot Cloud Cycle
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL || 'jobopenings_india,JobSkull' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Password for the Flask dashboard (main.py refuses to serve without it)
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          # Live submissions are irreversible; keep dry-run on in CI.
          BROWSER_USE_DRY_RUN: '1'
        run: |
          python cloud_runner.py

      - name: 💾 Commit & Push Application Logs & Verified Job Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # These runtime state files are .gitignore'd on purpose (they hold dedup
          # state), but the bot needs them committed to survive between runs.
          # Plain `git add` aborts the ENTIRE command on the first ignored pathspec,
          # and `2>/dev/null || true` hid that, so all dedup state silently reset on
          # every run and the same jobs were re-alerted. `-f` is required for each one.
          STATE_FILES="applied_jobs.json applied_jobs_log.csv radar_seen_jobs.txt \
                        tn_jobs_cache.json channel_status.json last_job.json"
          for f in $STATE_FILES; do
            if [ -e "$f" ]; then
              git add -f "$f"
            else
              echo "⚠️  state file missing, skipping: $f"
            fi
          done
          # Tracked (or explicitly un-ignored) already, so no -f needed.
          for f in qa_memory.json national_drives.json tn-live-jobs/data \
                   tn-live-jobs/public/data tn-live-jobs/report.md; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          echo "Staged:"; git diff --cached --name-only
          git commit -m "🤖 Cloud Run: Auto-updated jobs, state & verified TN radar [skip ci]"
          git pull --rebase --autostash -X ours origin main || git pull --rebase origin main || true
          git push origin main || echo "Push completed or already up to date"

      # 🔴 Watchdog: fires a Telegram alert if ANY earlier step failed (pip install,
      # checkout, cloud_runner crash, etc.) so silent breakage is never invisible.
      # Uses raw Bot API curl — no repo code or Python needed, works even if checkout failed.
      # Note: cancelled() is intentionally excluded — mid-run cancels from fresh pushes are normal.
      - name: 🚨 Alert Telegram on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          STATUS: ${{ job.status }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "🔴 GITHUB ACTIONS RUN FAILED — Job Bot Cloud" \
            "━━━━━━━━━━━━━━━━━━━━━━" \
            "Event: $EVENT | Status: $STATUS" \
            "Branch: $REF" \
            "Commit: ${SHA:0:10}" \
            "Logs: $RUN_URL" \
          | curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@-" \
              -d "disable_web_page_preview=true" || echo "Failed to deliver watchdog alert (check secrets)"

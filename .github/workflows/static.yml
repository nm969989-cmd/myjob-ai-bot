# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'tn-live-jobs/public/**'
      - 'tn-live-jobs/data/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble combined site
        run: |
          mkdir -p _site
          # Copy docs at site root
          cp -r docs/* _site/
          # Copy tn-live-jobs public under /tn-live-jobs/
          mkdir -p _site/tn-live-jobs
          cp -r tn-live-jobs/public/* _site/tn-live-jobs/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

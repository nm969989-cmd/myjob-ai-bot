name: Verify pull request

# Secret-free verification for pull requests. No Telegram, AI, Notion, email or
# employer credentials are referenced, so this is safe to run on forks and on
# every push. It mirrors the offline suite the bot workflow runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --quiet pytest pyyaml

      - name: 🧪 Offline Python Tests
        run: |
          python -m pytest test_careerops_integration.py test_job_discovery.py \
            test_dashboard.py test_cloud_runner.py test_public_sites.py \
            test_workflows.py -q -k "not network and not adzuna and not scrape"

      - name: 🌐 Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: 🧪 Browser UI Tests
        run: python -m pytest test_ui_browser.py -q

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tn-live-jobs/package-lock.json'

      - name: 📦 Install TN Live Jobs Dependencies
        run: |
          cd tn-live-jobs
          npm ci

      - name: 🧪 Node Tests
        run: node --test tn-live-jobs/test_priority_cities.js tn-live-jobs/test_client.js
